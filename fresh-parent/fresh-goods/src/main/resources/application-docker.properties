spring.application.name=fresh-goods
server.port=8082

spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.config.enabled=false
# Docker 关闭 Nacos 时，Feign 直连容器名+端口（勿省略端口，否则会打到 80）
fresh.feign.order-url=http://fresh-order:8083
fresh.feign.ai-url=http://fresh-ai:8084
fresh.feign.user-url=http://fresh-user:8081
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0

spring.datasource.primary.jdbc-url=jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/fresh_goods?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.primary.username=${MYSQL_USER:root}
spring.datasource.primary.password=${MYSQL_PASSWORD:root}
spring.datasource.primary.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.comment.jdbc-url=jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/fresh_comment?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.comment.username=${MYSQL_USER:root}
spring.datasource.comment.password=${MYSQL_PASSWORD:root}
spring.datasource.comment.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.promotion.jdbc-url=jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/fresh_promotion?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.promotion.username=${MYSQL_USER:root}
spring.datasource.promotion.password=${MYSQL_PASSWORD:root}
spring.datasource.promotion.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.fresh.goods.entity
mybatis-plus.global-config.banner=false
mybatis-plus.global-config.db-config.logic-delete-field=delFlag
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

fresh.goods.goods-cache-ttl=1800
fresh.goods.comment-cache-ttl=1800
fresh.goods.stock-warn-threshold=10

fresh.goods.oss.enabled=false
fresh.goods.oss.local-path=/app/uploads
fresh.goods.oss.base-url=http://127.0.0.1:8080/api/goods/upload

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.cloud.function.definition=orderCancelStockConsumer;groupExpireStatusConsumer
spring.cloud.stream.function.definition=orderCancelStockConsumer;groupExpireStatusConsumer
spring.cloud.stream.rocketmq.binder.name-server=${RMQ_NAMESRV:${ROCKETMQ_NAMESRV:rocketmq-nameserver:9876}}
spring.cloud.stream.bindings.orderCancelStockConsumer-in-0.destination=ORDER_CANCEL_STOCK_TOPIC
spring.cloud.stream.bindings.orderCancelStockConsumer-in-0.group=fresh-goods-group
spring.cloud.stream.bindings.groupExpireStatusConsumer-in-0.destination=GROUP_EXPIRE_TOPIC
spring.cloud.stream.bindings.groupExpireStatusConsumer-in-0.group=fresh-goods-group
spring.cloud.stream.bindings.stockChange-out-0.destination=STOCK_CHANGE_TOPIC
spring.cloud.stream.bindings.commentAdd-out-0.destination=COMMENT_ADD_TOPIC
spring.cloud.stream.bindings.couponReceive-out-0.destination=COUPON_RECEIVE_TOPIC
spring.cloud.stream.bindings.groupExpire-out-0.destination=GROUP_EXPIRE_TOPIC
