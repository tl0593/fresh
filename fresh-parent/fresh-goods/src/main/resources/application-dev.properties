spring.application.name=fresh-goods
server.port=8082

spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848
# 本地直连（Docker 无 Nacos 时同理）
fresh.feign.order-url=http://127.0.0.1:8083
fresh.feign.ai-url=http://127.0.0.1:8084
fresh.feign.user-url=http://127.0.0.1:8081
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6380
spring.data.redis.database=0

spring.datasource.primary.jdbc-url=jdbc:mysql://127.0.0.1:3307/fresh_goods?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.primary.username=root
spring.datasource.primary.password=root
spring.datasource.primary.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.comment.jdbc-url=jdbc:mysql://127.0.0.1:3307/fresh_comment?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.comment.username=root
spring.datasource.comment.password=root
spring.datasource.comment.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.promotion.jdbc-url=jdbc:mysql://127.0.0.1:3307/fresh_promotion?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.promotion.username=root
spring.datasource.promotion.password=root
spring.datasource.promotion.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.fresh.goods.entity
mybatis-plus.global-config.db-config.logic-delete-field=delFlag
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

fresh.goods.goods-cache-ttl=1800
fresh.goods.comment-cache-ttl=1800
fresh.goods.hot-list-cron=0 */10 * * * ?
fresh.goods.comment-rate-cron=0 */15 * * * ?
fresh.goods.promotion-cron=0 0 1 * * ?
fresh.goods.seckill-coupon-cron=0 59 * * * ?
fresh.goods.stock-warn-threshold=10

fresh.goods.oss.enabled=false
fresh.goods.oss.local-path=./uploads
# 经网关访问：/api/goods/upload/** → StripPrefix 后为 /upload/**
fresh.goods.oss.base-url=http://127.0.0.1:8080/api/goods/upload

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.cloud.sentinel.transport.dashboard=127.0.0.1:8080
spring.cloud.sentinel.eager=true

spring.cloud.stream.function.definition=orderCancelStockConsumer;groupExpireStatusConsumer
spring.cloud.stream.rocketmq.binder.name-server=127.0.0.1:9876
spring.cloud.stream.bindings.orderCancelStockConsumer-in-0.destination=ORDER_CANCEL_STOCK_TOPIC
spring.cloud.stream.bindings.orderCancelStockConsumer-in-0.group=fresh-goods-group
spring.cloud.stream.bindings.groupExpireStatusConsumer-in-0.destination=GROUP_EXPIRE_TOPIC
spring.cloud.stream.bindings.groupExpireStatusConsumer-in-0.group=fresh-goods-group
spring.cloud.stream.bindings.stockChange-out-0.destination=STOCK_CHANGE_TOPIC
spring.cloud.stream.bindings.commentAdd-out-0.destination=COMMENT_ADD_TOPIC
spring.cloud.stream.bindings.couponReceive-out-0.destination=COUPON_RECEIVE_TOPIC
spring.cloud.stream.bindings.groupExpire-out-0.destination=GROUP_EXPIRE_TOPIC

logging.level.com.fresh.goods=DEBUG
