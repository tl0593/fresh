spring.application.name=fresh-order
server.port=8083

spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6380
spring.data.redis.database=0

spring.datasource.url=jdbc:mysql://127.0.0.1:3307/fresh_order?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.fresh.order.entity
mybatis-plus.global-config.db-config.logic-delete-field=delFlag
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

fresh.order.unpaid-timeout=1800
fresh.order.group-expire-second=86400
fresh.order.unpaid-delay-level=16
fresh.order.wx-pay-mock=true

# RocketMQ
spring.cloud.stream.function.definition=orderUnpaidConsumer;commentAddConsumer
spring.cloud.stream.rocketmq.binder.name-server=127.0.0.1:9876
spring.cloud.stream.bindings.orderUnpaidConsumer-in-0.destination=ORDER_UNPAID_TOPIC
spring.cloud.stream.bindings.orderUnpaidConsumer-in-0.group=fresh-order-unpaid-group
spring.cloud.stream.bindings.commentAddConsumer-in-0.destination=COMMENT_ADD_TOPIC
spring.cloud.stream.bindings.commentAddConsumer-in-0.group=fresh-order-comment-group
spring.cloud.stream.bindings.orderCreate-out-0.destination=ORDER_CREATE_TOPIC
spring.cloud.stream.bindings.orderUnpaid-out-0.destination=ORDER_UNPAID_TOPIC
spring.cloud.stream.bindings.orderSuccess-out-0.destination=ORDER_SUCCESS_TOPIC
spring.cloud.stream.bindings.afterSaleImage-out-0.destination=AFTER_SALE_IMAGE_TOPIC
spring.cloud.stream.bindings.orderCancelStock-out-0.destination=ORDER_CANCEL_STOCK_TOPIC

# Sentinel
spring.cloud.sentinel.transport.dashboard=127.0.0.1:8080
spring.cloud.sentinel.eager=true

# 本地开发 Feign 直连（避免 Nacos 未注册时调用失败）
fresh.feign.user-url=http://127.0.0.1:8081
fresh.feign.goods-url=http://127.0.0.1:8082
spring.cloud.openfeign.client.config.fresh-user.url=http://127.0.0.1:8081
spring.cloud.openfeign.client.config.fresh-goods.url=http://127.0.0.1:8082

logging.level.com.fresh.order=DEBUG
logging.level.org.springframework=WARN
logging.level.com.baomidou.mybatisplus=WARN
