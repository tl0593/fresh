spring.application.name=fresh-data
server.port=8086

spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.config.enabled=false

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:fresh_data}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.fresh.data.entity

fresh.data.real-stat-ttl=86400
fresh.data.daily-stat-cron=0 0 1 * * ?
fresh.data.archive-day=30
fresh.data.max-query-days=90

# Feign 直连（Nacos discovery 关闭时必需）
fresh.feign.order-url=http://fresh-order:8083
fresh.feign.user-url=http://fresh-user:8081

spring.cloud.stream.function.definition=userBehaviorConsumer;aiChatBehaviorConsumer
spring.cloud.stream.rocketmq.binder.name-server=${RMQ_NAMESRV:rocketmq-nameserver:9876}
spring.cloud.stream.bindings.userBehaviorConsumer-in-0.destination=USER_BEHAVIOR_TOPIC
spring.cloud.stream.bindings.userBehaviorConsumer-in-0.group=fresh-data-behavior-group
spring.cloud.stream.bindings.aiChatBehaviorConsumer-in-0.destination=AI_CHAT_BEHAVIOR_TOPIC
spring.cloud.stream.bindings.aiChatBehaviorConsumer-in-0.group=fresh-data-ai-chat-group

logging.level.com.fresh.data=INFO
