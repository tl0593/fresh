spring.application.name=fresh-data
server.port=8086

spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848
spring.cloud.nacos.discovery.enabled=true

spring.data.redis.host=127.0.0.1
spring.data.redis.port=6380
spring.data.redis.database=0

spring.datasource.url=jdbc:mysql://127.0.0.1:3307/fresh_data?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.fresh.data.entity

fresh.data.real-stat-ttl=86400
fresh.data.daily-stat-cron=0 0 1 * * ?
fresh.data.archive-day=30
fresh.data.max-query-days=90

fresh.feign.order-url=http://127.0.0.1:8083
fresh.feign.user-url=http://127.0.0.1:8081

# RocketMQ（本地未启动时可注释 function.definition 禁用消费）
spring.cloud.stream.function.definition=userBehaviorConsumer;aiChatBehaviorConsumer;userRegisterConsumer;commentAddConsumer;couponReceiveConsumer
spring.cloud.stream.rocketmq.binder.name-server=127.0.0.1:9876
spring.cloud.stream.bindings.userBehaviorConsumer-in-0.destination=USER_BEHAVIOR_TOPIC
spring.cloud.stream.bindings.userBehaviorConsumer-in-0.group=fresh-data-behavior-group
spring.cloud.stream.bindings.aiChatBehaviorConsumer-in-0.destination=AI_CHAT_BEHAVIOR_TOPIC
spring.cloud.stream.bindings.aiChatBehaviorConsumer-in-0.group=fresh-data-ai-chat-group
spring.cloud.stream.bindings.userRegisterConsumer-in-0.destination=USER_REGISTER_TOPIC
spring.cloud.stream.bindings.userRegisterConsumer-in-0.group=fresh-data-register-group
spring.cloud.stream.bindings.commentAddConsumer-in-0.destination=COMMENT_ADD_TOPIC
spring.cloud.stream.bindings.commentAddConsumer-in-0.group=fresh-data-comment-group
spring.cloud.stream.bindings.couponReceiveConsumer-in-0.destination=COUPON_RECEIVE_TOPIC
spring.cloud.stream.bindings.couponReceiveConsumer-in-0.group=fresh-data-coupon-group

logging.level.com.fresh.data=DEBUG
