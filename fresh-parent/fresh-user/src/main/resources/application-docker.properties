spring.application.name=fresh-user
server.port=8081

spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.config.enabled=false

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:fresh_user}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.fresh.user.entity
mybatis-plus.global-config.db-config.logic-delete-field=delFlag
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

fresh.user.mini-token-expire=604800
fresh.user.admin-token-expire=7200
fresh.user.code-expire=300

# RocketMQ（支付成功等事件）
spring.cloud.stream.function.definition=orderSuccessConsumer;afterSaleRefundConsumer
spring.cloud.stream.rocketmq.binder.name-server=${RMQ_NAMESRV:rocketmq-nameserver:9876}
spring.cloud.stream.bindings.orderSuccessConsumer-in-0.destination=ORDER_SUCCESS_TOPIC
spring.cloud.stream.bindings.orderSuccessConsumer-in-0.group=fresh-user-order-group
spring.cloud.stream.bindings.afterSaleRefundConsumer-in-0.destination=AFTER_SALE_REFUND_TOPIC
spring.cloud.stream.bindings.afterSaleRefundConsumer-in-0.group=fresh-user-refund-group
spring.cloud.stream.bindings.userRegister-out-0.destination=USER_REGISTER_TOPIC
spring.cloud.stream.bindings.integralChange-out-0.destination=INTEGRAL_CHANGE_TOPIC
spring.cloud.stream.bindings.userBehavior-out-0.destination=USER_BEHAVIOR_TOPIC

logging.level.com.fresh.user=INFO
