spring.application.name=fresh-gateway
server.port=8080

spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.config.enabled=false

spring.data.redis.host=127.0.0.1
spring.data.redis.port=6380
spring.data.redis.database=0

spring.datasource.url=jdbc:mysql://127.0.0.1:3307/fresh_gateway?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.fresh.gateway.entity

spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.routes[0].id=fresh-user
spring.cloud.gateway.routes[0].uri=lb://fresh-user
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/user/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=2

spring.cloud.gateway.routes[1].id=fresh-goods
spring.cloud.gateway.routes[1].uri=lb://fresh-goods
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/goods/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=2

spring.cloud.gateway.routes[2].id=fresh-order
spring.cloud.gateway.routes[2].uri=lb://fresh-order
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/order/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=2

spring.cloud.gateway.routes[3].id=fresh-ai
spring.cloud.gateway.routes[3].uri=lb://fresh-ai
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/ai/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=2

spring.cloud.gateway.routes[4].id=fresh-message
spring.cloud.gateway.routes[4].uri=lb://fresh-message
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/message/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=2

spring.cloud.gateway.routes[5].id=fresh-data
spring.cloud.gateway.routes[5].uri=lb://fresh-data
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/data/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=2

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

fresh.gateway.token-header=Authorization
fresh.gateway.limit-time-second=60
fresh.gateway.access-log-enable=true

spring.cloud.sentinel.transport.dashboard=127.0.0.1:8080
spring.cloud.sentinel.transport.port=8719
spring.cloud.sentinel.eager=true
spring.cloud.sentinel.scg.fallback.mode=response
spring.cloud.sentinel.scg.fallback.response-status=503
spring.cloud.sentinel.scg.fallback.response-body={"code":503,"msg":"服务器繁忙，请稍后再试","data":null}
