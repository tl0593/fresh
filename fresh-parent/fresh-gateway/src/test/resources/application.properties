spring.application.name=fresh-gateway
server.port=0

spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.config.enabled=false
spring.autoconfigure.exclude=com.fresh.common.config.CommonCoreAutoConfiguration

spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/fresh_gateway?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.fresh.gateway.entity

spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.routes[0].id=fresh-user
spring.cloud.gateway.routes[0].uri=http://127.0.0.1:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/user/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=2

fresh.gateway.access-log-enable=false
spring.cloud.sentinel.eager=false
