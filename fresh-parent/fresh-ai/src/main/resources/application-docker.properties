spring.application.name=fresh-ai
server.port=8084

spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.config.enabled=false

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:fresh_ai}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.mapper-locations=classpath:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.fresh.ai.entity
mybatis-plus.global-config.db-config.logic-delete-field=delFlag
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

fresh.ai.llm.api-key=${DASHSCOPE_API_KEY:sk-xxx}
fresh.ai.llm.model=qwen-plus
fresh.ai.llm.vision-model=qwen-vl-plus
fresh.ai.llm.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
fresh.ai.llm.timeout=30000
fresh.ai.session-ttl=1800
fresh.ai.cook-cache-ttl=3600
fresh.ai.knowledge-cache-ttl=600

spring.cloud.stream.function.definition=afterSaleImageConsumer
spring.cloud.stream.rocketmq.binder.name-server=${ROCKETMQ_NAMESERVER:rocketmq:9876}
spring.cloud.stream.bindings.afterSaleImageConsumer-in-0.destination=AFTER_SALE_IMAGE_TOPIC
spring.cloud.stream.bindings.afterSaleImageConsumer-in-0.group=fresh-ai-group
spring.cloud.stream.bindings.aiRecognizeFinish-out-0.destination=AI_RECOGNIZE_FINISH_TOPIC
spring.cloud.stream.bindings.aiChatBehavior-out-0.destination=AI_CHAT_BEHAVIOR_TOPIC

logging.level.com.fresh.ai=INFO
